<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Muse Monitor app icon — design "A — Vòng headband + EEG" (design-A-headband-eeg.pdf).
       Source of truth: edit this file, then run  python packaging/icon/make_icons.py
       Colours: background #0F1828 · disc #13253F · headband #E6EDF7 · electrodes and EEG #3DDBB5 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#0F1828"/>
  <!-- the head (a disc) -->
  <circle cx="512" cy="625" r="374" fill="#13253F"/>
  <!-- the headband: an arc over the head -->
  <path d="M 200 660 L 200 622 A 312 312 0 0 1 824 622 L 824 660" fill="none" stroke="#E6EDF7"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- four electrodes on the band (TP9, AF7, AF8, TP10) -->
  <g fill="#3DDBB5" stroke="#0F1828" stroke-width="24">
    <circle cx="217" cy="516" r="50"/>
    <circle cx="379" cy="340" r="50"/>
    <circle cx="645" cy="340" r="50"/>
    <circle cx="807" cy="516" r="50"/>
  </g>
