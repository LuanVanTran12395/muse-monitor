[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musemonitor"
dynamic = ["version"]
description = "Realtime EEG / PPG / HRV / fNIRS / IMU monitor for Muse S Athena (BrainFlow + PySide6)"
requires-python = ">=3.10"
dependencies = [
    "brainflow>=5.23",
    "PySide6>=6.6,<6.12",          # 6.12.0 crashes on Python < 3.12 (none_dealloc); see requirements.txt
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
musemonitor = "musemonitor.app:main"

[tool.setuptools.dynamic]
version = { attr = "musemonitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
